quarkus:
  security:
    events:
      enabled: true
  http:
    auth:
      form:
        enabled: true
        landing-page: /
        error-page: login?error
        username-parameter: username
        password-parameter: password
      permission:
        custom1:
          paths: /api/*
          policy: authenticated
          auth-mechanism: session
        custom2:
          paths: /*
          policy: permit
          auth-mechanism: form
        vaadin:
          paths: ["/VAADIN/*", "/favicon.ico", "/robots.txt", "/manifest.webmanifest", "/sw.js", "/offline.html", "/icons/*", "/images/*", "/styles/*", "/h2-console/*", "/q/*"]
          policy: permit
          auth-mechanism: basic
      proactive: true

  datasource:
    db-kind: postgresql
    jdbc:
      max-size: 16

  hibernate-orm:
#    multitenant: schema
    dialect: "org.hibernate.dialect.PostgreSQLDialect"
    database:
      generation: drop-and-create
    log:
      sql: true
      format-sql: true
      highlight-sql: true
